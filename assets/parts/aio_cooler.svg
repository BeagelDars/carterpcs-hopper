<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 90" width="130" height="90">
  <defs>
    <linearGradient id="radMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="pumpMirror" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="80%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>

  <!-- Shadow -->
  <rect x="10" y="82" width="110" height="6" rx="3" fill="#0f172a" opacity="0.25"/>

  <!-- Radiator Block (Top/Left) -->
  <rect x="8" y="8" width="76" height="42" rx="4" fill="url(#radMetal)" stroke="#334155" stroke-width="1.5"/>

  <!-- Radiator Fan 1 -->
  <circle cx="28" cy="29" r="16" fill="#020617" stroke="#475569" stroke-width="1"/>
  <circle cx="28" cy="29" r="5" fill="#38bdf8"/>
  <line x1="28" y1="15" x2="28" y2="43" stroke="#334155" stroke-width="2"/>
  <line x1="14" y1="29" x2="42" y2="29" stroke="#334155" stroke-width="2"/>

  <!-- Radiator Fan 2 -->
  <circle cx="64" cy="29" r="16" fill="#020617" stroke="#475569" stroke-width="1"/>
  <circle cx="64" cy="29" r="5" fill="#38bdf8"/>
  <line x1="64" y1="15" x2="64" y2="43" stroke="#334155" stroke-width="2"/>
  <line x1="50" y1="29" x2="78" y2="29" stroke="#334155" stroke-width="2"/>

  <!-- Braided Coolant Tubes (curving from radiator to pump block) -->
  <path d="M 76 18 C 96 18, 92 48, 102 56" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <path d="M 76 18 C 96 18, 92 48, 102 56" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="2,2" stroke-linecap="round"/>

  <path d="M 76 38 C 100 38, 96 66, 108 68" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <path d="M 76 38 C 100 38, 96 66, 108 68" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="2,2" stroke-linecap="round"/>

  <!-- CPU Pump / Water Block (Round RGB) -->
  <circle cx="106" cy="64" r="19" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="106" cy="64" r="15" fill="url(#pumpMirror)"/>
  <circle cx="106" cy="64" r="9" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="106" y="66" font-family="system-ui, sans-serif" font-size="4" font-weight="900" fill="#ffffff" text-anchor="middle">AIO</text>
</svg>
