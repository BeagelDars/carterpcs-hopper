<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="syringeBarrel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="pasteGoo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <rect x="10" y="34" width="100" height="4" rx="2" fill="#0f172a" opacity="0.25"/>

  <!-- Plunger Rod (Right) -->
  <rect x="80" y="17" width="28" height="6" fill="#0284c7"/>
  <!-- Plunger Thumb rest -->
  <rect x="108" y="10" width="6" height="20" rx="2" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>

  <!-- Main Barrel -->
  <rect x="25" y="12" width="60" height="16" rx="3" fill="url(#syringeBarrel)" stroke="#64748b" stroke-width="1.2"/>

  <!-- Finger Flanges -->
  <rect x="82" y="7" width="4" height="26" rx="2" fill="#94a3b8"/>

  <!-- Thermal Paste inside barrel -->
  <rect x="28" y="14" width="38" height="12" rx="2" fill="url(#pasteGoo)"/>

  <!-- Measurement graduation markings -->
  <line x1="35" y1="12" x2="35" y2="16" stroke="#0f172a" stroke-width="1"/>
  <line x1="42" y1="12" x2="42" y2="16" stroke="#0f172a" stroke-width="1"/>
  <line x1="49" y1="12" x2="49" y2="16" stroke="#0f172a" stroke-width="1"/>
  <line x1="56" y1="12" x2="56" y2="16" stroke="#0f172a" stroke-width="1"/>
  <line x1="63" y1="12" x2="63" y2="16" stroke="#0f172a" stroke-width="1"/>

  <!-- Syringe Nozzle Tip (Left) -->
  <polygon points="25,16 10,18 10,22 25,24" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>

  <!-- Pea-sized drop of thermal paste oozing out! -->
  <circle cx="7" cy="20" r="4.5" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <circle cx="6" cy="18" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Label text -->
  <text x="50" y="22" font-family="system-ui, sans-serif" font-size="4" font-weight="900" fill="#0f172a" text-anchor="middle">PEA-SIZE PASTE</text>
</svg>
