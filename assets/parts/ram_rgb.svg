<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 50" width="140" height="50">
  <defs>
    <linearGradient id="ramRgb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="25%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ramHeatspreader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <rect x="6" y="44" width="128" height="6" rx="3" fill="#0f172a" opacity="0.25"/>

  <!-- Gold Pins (Bottom contacts with notch) -->
  <g fill="#eab308">
    <!-- Left pins -->
    <rect x="14" y="38" width="50" height="6" rx="1"/>
    <!-- Key Notch at x=64 -->
    <!-- Right pins -->
    <rect x="74" y="38" width="52" height="6" rx="1"/>
  </g>
  <!-- Pin lines -->
  <g stroke="#ca8a04" stroke-width="1">
    <line x1="18" y1="38" x2="18" y2="44"/>
    <line x1="24" y1="38" x2="24" y2="44"/>
    <line x1="30" y1="38" x2="30" y2="44"/>
    <line x1="36" y1="38" x2="36" y2="44"/>
    <line x1="42" y1="38" x2="42" y2="44"/>
    <line x1="48" y1="38" x2="48" y2="44"/>
    <line x1="54" y1="38" x2="54" y2="44"/>
    <line x1="60" y1="38" x2="60" y2="44"/>
    <line x1="78" y1="38" x2="78" y2="44"/>
    <line x1="84" y1="38" x2="84" y2="44"/>
    <line x1="90" y1="38" x2="90" y2="44"/>
    <line x1="96" y1="38" x2="96" y2="44"/>
    <line x1="102" y1="38" x2="102" y2="44"/>
    <line x1="108" y1="38" x2="108" y2="44"/>
    <line x1="114" y1="38" x2="114" y2="44"/>
    <line x1="120" y1="38" x2="120" y2="44"/>
  </g>

  <!-- Black Substrate PCB -->
  <rect x="10" y="10" width="120" height="30" rx="3" fill="#020617"/>

  <!-- Aluminum Heatspreader -->
  <polygon points="12,12 128,12 125,37 15,37" fill="url(#ramHeatspreader)" stroke="#475569" stroke-width="1.2"/>

  <!-- Geometric Cuts / Styling -->
  <line x1="35" y1="18" x2="50" y2="33" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="18" x2="105" y2="33" stroke="#334155" stroke-width="2"/>

  <!-- RAM Text / Spec -->
  <text x="70" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="5" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1">DDR5 RGB 64GB</text>
  <text x="70" y="32" font-family="system-ui, -apple-system, monospace" font-size="3.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">6000MHz CL30</text>

  <!-- Glowing Top RGB Diffuser Strip -->
  <rect x="16" y="5" width="108" height="6" rx="3" fill="url(#ramRgb)"/>
  <rect x="20" y="6" width="100" height="2" rx="1" fill="#ffffff" opacity="0.6"/>
</svg>
