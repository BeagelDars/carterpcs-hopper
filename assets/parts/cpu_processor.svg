<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cpuSubstrate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="ihsMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <rect x="10" y="88" width="80" height="8" rx="4" fill="#0f172a" opacity="0.25"/>

  <!-- PCB Green Substrate -->
  <rect x="10" y="10" width="80" height="80" rx="4" fill="url(#cpuSubstrate)" stroke="#166534" stroke-width="1.5"/>

  <!-- Gold Contact Edge Pads (dots around edges) -->
  <g fill="#eab308">
    <circle cx="16" cy="16" r="1.5"/>
    <circle cx="22" cy="16" r="1.5"/>
    <circle cx="78" cy="16" r="1.5"/>
    <circle cx="84" cy="16" r="1.5"/>
    <circle cx="16" cy="84" r="1.5"/>
    <circle cx="22" cy="84" r="1.5"/>
    <circle cx="78" cy="84" r="1.5"/>
    <circle cx="84" cy="84" r="1.5"/>
  </g>

  <!-- Gold Triangle Alignment Pin at Top-Left -->
  <polygon points="13,13 21,13 13,21" fill="#facc15"/>

  <!-- IHS (Integrated Heat Spreader) Nickel Plated Cap -->
  <rect x="22" y="22" width="56" height="56" rx="5" fill="url(#ihsMetal)" stroke="#64748b" stroke-width="1.5"/>

  <!-- IHS Wings/Indents -->
  <rect x="18" y="38" width="5" height="24" rx="2" fill="url(#ihsMetal)" stroke="#64748b" stroke-width="1"/>
  <rect x="77" y="38" width="5" height="24" rx="2" fill="url(#ihsMetal)" stroke="#64748b" stroke-width="1"/>

  <!-- Laser Engraved CPU details -->
  <text x="50" y="42" font-family="system-ui, -apple-system, monospace" font-size="5" font-weight="900" fill="#334155" text-anchor="middle">CARTER-CORE</text>
  <text x="50" y="52" font-family="system-ui, -apple-system, monospace" font-size="7" font-weight="900" fill="#0f172a" text-anchor="middle">i9-14900KS</text>
  <text x="50" y="60" font-family="system-ui, -apple-system, monospace" font-size="4" font-weight="600" fill="#475569" text-anchor="middle">6.20 GHz • 24 CORES</text>
  <rect x="36" y="64" width="28" height="5" rx="1" fill="#64748b" opacity="0.3"/>
  <text x="50" y="68" font-family="system-ui, -apple-system, monospace" font-size="3" fill="#1e293b" text-anchor="middle">LGA 1700</text>
</svg>
