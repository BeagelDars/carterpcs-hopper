<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 45" width="130" height="45">
  <defs>
    <linearGradient id="ssdHeatsink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <rect x="6" y="38" width="118" height="5" rx="2.5" fill="#0f172a" opacity="0.25"/>

  <!-- PCB Board -->
  <rect x="6" y="8" width="118" height="28" rx="2" fill="#064e3b" stroke="#047857" stroke-width="1"/>

  <!-- Golden M.2 Pins (Left) -->
  <rect x="8" y="12" width="12" height="20" rx="1" fill="#eab308"/>
  <rect x="14" y="10" width="2" height="24" fill="#064e3b"/> <!-- M Key Notch -->

  <!-- Mounting Semicircle Notch (Right) -->
  <path d="M 124 16 A 6 6 0 0 0 124 28 L 124 16" fill="#f8fafc"/>

  <!-- Aluminum Heatsink Cover -->
  <rect x="24" y="10" width="94" height="24" rx="2" fill="url(#ssdHeatsink)" stroke="#64748b" stroke-width="1"/>
  <!-- Fin lines -->
  <line x1="30" y1="14" x2="112" y2="14" stroke="#334155" stroke-width="1.5"/>
  <line x1="30" y1="18" x2="112" y2="18" stroke="#334155" stroke-width="1.5"/>
  <line x1="30" y1="26" x2="112" y2="26" stroke="#334155" stroke-width="1.5"/>
  <line x1="30" y1="30" x2="112" y2="30" stroke="#334155" stroke-width="1.5"/>

  <!-- Text -->
  <text x="70" y="23" font-family="system-ui, sans-serif" font-size="5" font-weight="900" fill="#38bdf8" text-anchor="middle">GEN 5 NVMe 4TB • 14,000 MB/s</text>
</svg>
