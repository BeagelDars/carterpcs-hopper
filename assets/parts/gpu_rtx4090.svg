<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <defs>
    <linearGradient id="gpuBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="rgbGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Drop Shadow -->
  <rect x="6" y="80" width="148" height="8" rx="4" fill="#0f172a" opacity="0.25"/>

  <!-- PCIe Connector Bracket -->
  <rect x="12" y="70" width="40" height="8" rx="1" fill="#eab308"/>
  <rect x="14" y="72" width="3" height="4" fill="#ca8a04"/>
  <rect x="20" y="72" width="3" height="4" fill="#ca8a04"/>
  <rect x="26" y="72" width="3" height="4" fill="#ca8a04"/>
  <rect x="32" y="72" width="3" height="4" fill="#ca8a04"/>
  <rect x="38" y="72" width="3" height="4" fill="#ca8a04"/>
  <rect x="44" y="72" width="3" height="4" fill="#ca8a04"/>

  <!-- Main Shroud -->
  <rect x="8" y="10" width="144" height="64" rx="8" fill="url(#gpuBody)" stroke="#475569" stroke-width="1.5"/>

  <!-- Aluminum Heatsink Fins (lines) -->
  <g stroke="#64748b" stroke-width="1" opacity="0.4">
    <line x1="14" y1="16" x2="14" y2="68"/>
    <line x1="18" y1="16" x2="18" y2="68"/>
    <line x1="22" y1="16" x2="22" y2="68"/>
    <line x1="138" y1="16" x2="138" y2="68"/>
    <line x1="142" y1="16" x2="142" y2="68"/>
    <line x1="146" y1="16" x2="146" y2="68"/>
  </g>

  <!-- Fan 1 (Left) -->
  <circle cx="38" cy="42" r="22" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
  <!-- Fan blades -->
  <g stroke="#334155" stroke-width="3" stroke-linecap="round">
    <line x1="38" y1="24" x2="38" y2="34"/>
    <line x1="38" y1="50" x2="38" y2="60"/>
    <line x1="20" y1="42" x2="30" y2="42"/>
    <line x1="46" y1="42" x2="56" y2="42"/>
    <line x1="25" y1="29" x2="32" y2="36"/>
    <line x1="44" y1="48" x2="51" y2="55"/>
    <line x1="25" y1="55" x2="32" y2="48"/>
    <line x1="44" y1="36" x2="51" y2="29"/>
  </g>
  <circle cx="38" cy="42" r="7" fill="url(#metalPlate)"/>
  <circle cx="38" cy="42" r="3" fill="#1e293b"/>

  <!-- Fan 2 (Center) -->
  <circle cx="80" cy="42" r="22" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
  <!-- Fan blades -->
  <g stroke="#334155" stroke-width="3" stroke-linecap="round">
    <line x1="80" y1="24" x2="80" y2="34"/>
    <line x1="80" y1="50" x2="80" y2="60"/>
    <line x1="62" y1="42" x2="72" y2="42"/>
    <line x1="88" y1="42" x2="98" y2="42"/>
    <line x1="67" y1="29" x2="74" y2="36"/>
    <line x1="86" y1="48" x2="93" y2="55"/>
    <line x1="67" y1="55" x2="74" y2="48"/>
    <line x1="86" y1="36" x2="93" y2="29"/>
  </g>
  <circle cx="80" cy="42" r="7" fill="url(#metalPlate)"/>
  <circle cx="80" cy="42" r="3" fill="#1e293b"/>

  <!-- Fan 3 (Right) -->
  <circle cx="122" cy="42" r="22" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
  <!-- Fan blades -->
  <g stroke="#334155" stroke-width="3" stroke-linecap="round">
    <line x1="122" y1="24" x2="122" y2="34"/>
    <line x1="122" y1="50" x2="122" y2="60"/>
    <line x1="104" y1="42" x2="114" y2="42"/>
    <line x1="130" y1="42" x2="140" y2="42"/>
    <line x1="109" y1="29" x2="116" y2="36"/>
    <line x1="128" y1="48" x2="135" y2="55"/>
    <line x1="109" y1="55" x2="116" y2="48"/>
    <line x1="128" y1="36" x2="135" y2="29"/>
  </g>
  <circle cx="122" cy="42" r="7" fill="url(#metalPlate)"/>
  <circle cx="122" cy="42" r="3" fill="#1e293b"/>

  <!-- RGB Light Strip Top -->
  <rect x="25" y="12" width="110" height="3" rx="1.5" fill="url(#rgbGlow)"/>

  <!-- RTX 4090 text badge -->
  <rect x="56" y="66" width="48" height="6" rx="2" fill="#0f172a"/>
  <text x="80" y="71" font-family="system-ui, -apple-system, sans-serif" font-size="5" font-weight="900" fill="#22c55e" text-anchor="middle" letter-spacing="0.5">RTX 4090</text>
</svg>
