<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Carter's PC Hopper</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/carter_head.png">
</head>
<body>
  <div class="arcade-wrapper">
    <!-- Cartoon Header -->
    <header class="game-header">
      <div class="logo-badge">CARTER PCs</div>
      <div class="scores-wrap">
        <div class="score-chip">⭐ <span id="score-display">0</span></div>
        <div class="score-chip best-chip">🏆 <span id="highscore-display">0</span></div>
        <button id="btn-sound" class="btn-sound" title="Toggle Sound">🔊</button>
      </div>
    </header>

    <!-- Canvas Game Container -->
    <main class="game-stage">
      <canvas id="game-canvas"></canvas>

      <!-- Start Screen -->
      <div class="cartoon-modal-overlay" id="start-overlay">
        <div class="cartoon-box">
          <div class="carter-pop-avatar">
            <img src="assets/carter_head.png" alt="Carter">
          </div>
          <h1 class="cartoon-title">PC HOPPER!</h1>
          <p class="cartoon-desc">5 Lanes of Computer Parts! Dodge & Jump to survive!</p>
          <button id="btn-start" class="btn-cartoon-primary">START RUN [SPACE]</button>
        </div>
      </div>

      <!-- Game Over Screen -->
      <div class="cartoon-modal-overlay hidden" id="gameover-overlay">
        <div class="cartoon-box">
          <div class="carter-pop-avatar oof">
            <img src="assets/carter_head.png" alt="Carter">
          </div>
          <h2 class="cartoon-title oof-title">OOF!</h2>
          <div class="cartoon-score-card">
            <div>SCORE: <b id="final-score">0</b></div>
            <div>BEST: <b id="best-score">0</b></div>
          </div>
          <button id="btn-restart" class="btn-cartoon-primary">PLAY AGAIN [SPACE]</button>
        </div>
      </div>
    </main>

    <!-- Chunky Cartoon Bottom Controls -->
    <footer class="game-controls">
      <button class="btn-arcade btn-steer" id="btn-left" aria-label="Left">◀</button>
      <button class="btn-arcade btn-jump" id="btn-jump">
        <span class="jump-title">JUMP! 🚀</span>
        <div class="jump-cooldown-bar"><div class="jump-cooldown-fill" id="cooldown-fill"></div></div>
      </button>
      <button class="btn-arcade btn-steer" id="btn-right" aria-label="Right">▶</button>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
